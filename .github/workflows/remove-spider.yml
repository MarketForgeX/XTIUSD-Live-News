name: Remove spider web header

on:
  push:
    paths:
      - '.github/workflows/remove-spider.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-spider:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean header and animate live dots
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          # Remove any remaining spider canvas.
          html = re.sub(r'<canvas\s+id=["\']spiderCanvas["\'][^>]*></canvas>', '', html, flags=re.I)

          # Remove any remaining spider animation scripts.
          html = re.sub(r'<script\s+id=["\']xti-spider-animation["\'][^>]*>.*?</script>', '', html, flags=re.S | re.I)
          html = re.sub(r'<script>\s*\(function\(\)\{\s*const canvas=document\.getElementById\(["\']spiderCanvas["\']\).*?const COUNT=34.*?</script>', '', html, flags=re.S | re.I)

          # Remove any remaining spider-web CSS comment/block without touching the rest of the stylesheet.
          html = re.sub(r'/\*\s*Animated spider-web network in the top XTIUSD header\s*\*/.*?(?=</style>)', '', html, flags=re.S | re.I)

          # Restore/keep the original two header sections.
          required = [
              'XTI<b>USD</b>',
              'LIVE NEWS',
              'CRUDE OIL NEWS.',
              'SMARTER TRADING.',
              'STAY INFORMED',
              'STAY AHEAD',
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit(f'Header safety check failed; missing: {missing}')

          # Make both LIVE indicators blink continuously.
          html = html.replace(
              'XTIUSD <span class="green">• LIVE</span>',
              'XTIUSD <span class="green live-status"><i>•</i> LIVE</span>'
          )
          html = html.replace(
              'HEADLINES <span class="green">● LIVE</span>',
              'HEADLINES <span class="green live-status"><i>●</i> LIVE</span>'
          )

          blink_css = '''\n.live-status i{font-style:normal;display:inline-block;animation:liveBlink 1.15s ease-in-out infinite;transform-origin:center}@keyframes liveBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.18;transform:scale(.72)}}\n'''
          if '.live-status i{font-style:normal' not in html:
              html = html.replace('</style>', blink_css + '</style>', 1)

          if html != original:
              path.write_text(html, encoding='utf-8')
              print('Spider removed and LIVE dots set to blinking animation.')
          else:
              print('No changes required.')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'marketforgex-news-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'style: animate XTIUSD and headlines live dots'
          git push
