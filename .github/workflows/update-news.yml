name: Update XTIUSD live news

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-news.yml"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build news feed and market analysis
        shell: bash
        run: |
          python <<'PY'
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime
          from math import exp

          feeds = [
              ("Google News", "https://news.google.com/rss/search?q=(WTI+OR+%22crude+oil%22+OR+%22West+Texas+Intermediate%22+OR+OPEC)+oil&hl=en-US&gl=US&ceid=US:en"),
              ("Google News", "https://news.google.com/rss/search?q=oil+prices+WTI+OPEC+EIA&hl=en-US&gl=US&ceid=US:en"),
              ("Google News", "https://news.google.com/rss/search?q=WTI+crude+oil+inventory+supply+Iran+Saudi+OPEC&hl=en-US&gl=US&ceid=US:en"),
              ("S&P Global", "https://www.spglobal.com/content/spglobal/energy/us/en/rss/oil.xml"),
              ("S&P Global", "https://www.spglobal.com/content/spglobal/energy/us/en/rss/oil-crude.xml"),
              ("EIA", "https://www.eia.gov/rss/press_room.xml"),
              ("EIA", "https://www.eia.gov/rss/todayinenergy.xml"),
              ("Rigzone", "https://www.rigzone.com/news/rss/rigzone_latest.aspx"),
          ]

          keywords = re.compile(r"\b(wti|xtiusd|crude oil|west texas intermediate|oil prices?|opec|opec\+|eia|inventor(?:y|ies)|oil supply|production|refinery|pipeline|sanctions|strategic petroleum reserve|spr|hormuz|middle east|iran|saudi|russia|ukraine|oil demand|petroleum)\b", re.I)
          items, seen = [], set()
          now = datetime.now(timezone.utc)

          def text(el, name):
              node = el.find(name)
              return (node.text or "").strip() if node is not None else ""

          for default_source, url in feeds:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 XTIUSD-Live-News"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      root = ET.fromstring(r.read())
                  for item in root.findall(".//item"):
                      title = text(item, "title")
                      link = text(item, "link")
                      pub = text(item, "pubDate") or text(item, "published") or text(item, "updated")
                      source = text(item, "source") or default_source
                      if not title or not link or not keywords.search(title):
                          continue
                      try:
                          dt = parsedate_to_datetime(pub).astimezone(timezone.utc)
                      except Exception:
                          dt = now
                      key = link.lower().strip()
                      if key in seen:
                          continue
                      seen.add(key)
                      tl = title.lower()
                      tags = []
                      if any(k in tl for k in ("wti", "crude oil", "west texas", "oil price")):
                          tags.append("WTI")
                      if "opec" in tl:
                          tags.append("OPEC")
                      if any(k in tl for k in ("eia", "inventory", "inventories")):
                          tags.append("EIA")
                      if any(k in tl for k in ("supply", "production", "refinery", "pipeline", "sanction", "hormuz", "iran", "saudi", "russia", "petroleum")):
                          tags.append("Supply")
                      items.append({"title": title, "url": link, "published": dt.isoformat(), "source": source, "category": "Crude Oil", "tags": tags or ["WTI"]})
              except Exception as e:
                  print(f"feed error [{default_source}]: {e}")

          items.sort(key=lambda x: x["published"], reverse=True)
          items = items[:150]
          with open("data/news.json", "w", encoding="utf-8") as f:
              json.dump({"updated_at": now.isoformat(), "items": items}, f, ensure_ascii=False, indent=2)

          bullish = {
              "supply disruption": 3.0, "supply disruption": 3.0, "production cut": 3.0,
              "output cut": 3.0, "opec+ cut": 3.0, "opec cut": 3.0, "inventory draw": 2.5,
              "inventories fall": 2.5, "inventory falls": 2.5, "inventories decline": 2.5,
              "stockpiles fall": 2.0, "sanctions": 1.7, "hormuz": 2.3, "shipping disruption": 2.0,
              "refinery outage": 1.7, "pipeline disruption": 1.8, "war": 1.0, "escalation": 1.2,
              "supply risk": 1.8, "tight supply": 2.0, "strong demand": 1.2, "demand rises": 1.2,
          }
          bearish = {
              "production increase": 3.0, "output increase": 3.0, "opec+ increase": 3.0,
              "opec increase": 3.0, "inventory build": 2.5, "inventories rise": 2.5,
              "inventories increase": 2.5, "stockpiles rise": 2.0, "supply increase": 2.0,
              "supply rises": 2.0, "production rises": 2.5, "refinery restart": 1.5,
              "demand slowdown": 2.0, "weak demand": 2.0, "recession": 1.5, "ceasefire": 1.2,
              "de-escalation": 1.2, "exports rise": 1.8, "supply recovery": 1.7,
          }
          topic_weights = {
              "geopolitics": ("iran", "hormuz", "middle east", "war", "escalation", "sanction", "russia", "ukraine"),
              "opec+ policy": ("opec", "output", "production cut", "production increase"),
              "inventories": ("inventory", "inventories", "stockpiles", "eia"),
              "supply": ("supply", "production", "refinery", "pipeline", "exports"),
              "demand": ("demand", "recession", "economic", "growth"),
          }

          def make_analysis(hours, label):
              cutoff = now - timedelta(hours=hours)
              relevant = []
              for item in items:
                  try:
                      dt = datetime.fromisoformat(item["published"].replace("Z", "+00:00"))
                  except Exception:
                      continue
                  if dt < cutoff:
                      continue
                  age_hours = max(0.0, (now - dt).total_seconds() / 3600.0)
                  half_life = max(hours / 3.0, 8.0)
                  recency = exp(-age_hours / half_life)
                  title = item["title"].lower()
                  score = 0.0
                  for phrase, weight in bullish.items():
                      if phrase in title:
                          score += weight * recency
                  for phrase, weight in bearish.items():
                      if phrase in title:
                          score -= weight * recency
                  if score != 0:
                      relevant.append((score, item))

              raw = sum(x[0] for x in relevant)
              count = len(relevant)
              normalized = max(-50, min(50, raw * (1.5 if hours <= 24 else 1.0 if hours <= 168 else 0.75)))
              score = int(round(50 + normalized))
              if score >= 62:
                  bias = "Bullish"
              elif score <= 38:
                  bias = "Bearish"
              else:
                  bias = "Neutral"

              if count >= 12:
                  confidence = "High"
              elif count >= 5:
                  confidence = "Moderate"
              else:
                  confidence = "Low"

              topics = []
              for topic, words in topic_weights.items():
                  n = sum(1 for _, item in relevant if any(w in item["title"].lower() for w in words))
                  if n:
                      topics.append((n, topic))
              topics.sort(reverse=True)
              drivers = [x[1].title() for x in topics[:4]] or ["Fresh crude-oil headlines"]

              if bias == "Bullish":
                  summary = f"Recent crude-oil headlines show a positive supply-risk bias, with {count} materially relevant signals in the selected window. New supply disruptions, OPEC+ restraint or tighter inventories could extend upside pressure."
              elif bias == "Bearish":
                  summary = f"Recent crude-oil headlines show a negative supply-demand bias, with {count} materially relevant signals in the selected window. Higher supply, inventory builds or weaker demand expectations could pressure WTI."
              else:
                  summary = f"Recent crude-oil headlines remain mixed, with {count} materially relevant signals in the selected window. WTI direction can change quickly as OPEC+, inventories, demand and geopolitical supply risks develop."

              bullish_case = "Supply disruption, tighter inventories, OPEC+ restraint or geopolitical escalation would strengthen the upside case."
              bearish_case = "Higher production, inventory builds, weaker demand or easing geopolitical risk would strengthen the downside case."

              return {
                  "label": label, "bias": bias, "score": score, "confidence": confidence,
                  "summary": summary, "bullish_case": bullish_case, "bearish_case": bearish_case,
                  "drivers": drivers, "headline_count": count
              }

          analysis = {
              "generated_at": now.isoformat(),
              "method": "Free rule-based market intelligence recalculated from the live crude-oil headline feed. No paid API or AI API required.",
              "periods": {
                  "24h": make_analysis(24, "NEXT 24 HOURS"),
                  "7d": make_analysis(24 * 7, "NEXT 7 DAYS"),
                  "1m": make_analysis(24 * 30, "NEXT 1 MONTH"),
              }
          }
          with open("data/market-analysis.json", "w", encoding="utf-8") as f:
              json.dump(analysis, f, ensure_ascii=False, indent=2)
          print(f"wrote {len(items)} headlines and dynamic analysis")
          PY

      - name: Commit feed and analysis
        shell: bash
        run: |
          git config user.name "marketforgex-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/market-analysis.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh crude oil headlines and market analysis"
          git push
