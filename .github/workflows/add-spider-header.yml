name: Add XTIUSD spider header animation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/add-spider-header.yml"

permissions:
  contents: write

jobs:
  add-animation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject animated spider-web header
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          marker = "id=\"spiderCanvas\""

          if marker not in html:
              style = r'''\n/* Animated spider-web network in the top XTIUSD header */\n.heroHead{position:relative;overflow:hidden}\n#spiderCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.48}\n.heroHead>*:not(#spiderCanvas){position:relative;z-index:1}\n'''
              html = html.replace("</style>", style + "</style>", 1)
              html = html.replace('<header class="heroHead">', '<header class="heroHead"><canvas id="spiderCanvas" aria-hidden="true"></canvas>', 1)

              script = r'''\n<script>\n(function(){\n  const canvas=document.getElementById('spiderCanvas');\n  const host=document.querySelector('.heroHead');\n  if(!canvas||!host)return;\n  const ctx=canvas.getContext('2d');\n  let w=0,h=0,dpr=1,points=[];\n  const COUNT=34,SPEED=1.65,MAX_LINK=155;\n  function resize(){\n    const r=host.getBoundingClientRect();\n    dpr=Math.min(window.devicePixelRatio||1,2); w=Math.max(1,r.width); h=Math.max(1,r.height);\n    canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);\n    canvas.style.width=w+'px'; canvas.style.height=h+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);\n    if(points.length===0)for(let i=0;i<COUNT;i++)points.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*SPEED,vy:(Math.random()-.5)*SPEED,r:1.2+Math.random()*1.8});\n    else points.forEach(p=>{p.x=Math.min(w,Math.max(0,p.x));p.y=Math.min(h,Math.max(0,p.y));});\n  }\n  function tick(){\n    ctx.clearRect(0,0,w,h);\n    for(const p of points){\n      p.x+=p.vx; p.y+=p.vy;\n      if(p.x<-10||p.x>w+10)p.vx*=-1;\n      if(p.y<-10||p.y>h+10)p.vy*=-1;\n    }\n    for(let i=0;i<points.length;i++){\n      for(let j=i+1;j<points.length;j++){\n        const a=points[i],b=points[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);\n        if(d<MAX_LINK){\n          const alpha=(1-d/MAX_LINK)*.30;\n          ctx.strokeStyle='rgba(255,120,0,'+alpha+')'; ctx.lineWidth=1;\n          ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();\n        }\n      }\n    }\n    for(const p of points){\n      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);\n      ctx.fillStyle='rgba(255,120,0,.72)';ctx.fill();\n    }\n    requestAnimationFrame(tick);\n  }\n  resize(); window.addEventListener('resize',resize,{passive:true}); tick();\n})();\n</script>\n'''
              html = html.replace("</body>", script + "</body>", 1)
              path.write_text(html, encoding="utf-8")
              print("Injected animated spider-web header")
          else:
              print("Spider animation already present")
          PY

      - name: Commit animation
        shell: bash
        run: |
          git config user.name "marketforgex-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add fast animated spider web header"
          git push
